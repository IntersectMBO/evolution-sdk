[package]
name = "aiken-uplc"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Keep this at 1.1.21 or newer. Earlier releases compared the CBOR container
# representation (definite vs. indefinite) instead of the Plutus Data value.
uplc = "1.1.21"
wasm-bindgen = "0.2.93"
js-sys = "0.3.70"
wee_alloc = "0.4.5"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
